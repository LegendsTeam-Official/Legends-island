[package]
name = "legends-island"
version = "0.6.1"
description = "Legends Island"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-updater = "2"
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = "=0.30.13"
notify = "6"
tiny_http = "0.12"
form_urlencoded = "1"
arboard = "3"
ureq = "2"
base64 = "0.22"
rqrr = "0.8"
png = "0.17"
sha2 = "0.10"
zip = { version = "2", default-features = false, features = ["deflate"] }

[target.'cfg(windows)'.dependencies]
rusqlite = { version = "0.32", features = ["bundled"] }
windows = { version = "0.58", features = ["Media_Control", "Foundation", "Foundation_Collections", "Win32_System_WinRT", "Storage_Streams", "Media_Ocr", "Graphics_Imaging", "Security_Cryptography", "Globalization", "Win32_Foundation", "Win32_System_DataExchange", "Win32_Graphics_Gdi", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging", "Win32_Media_Audio", "Win32_Media_Audio_Endpoints", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Variant", "Win32_System_Threading", "Win32_System_SystemInformation", "Win32_System_Performance", "Win32_System_Registry", "Win32_UI_Shell", "Win32_UI_Controls", "Win32_Storage_FileSystem", "Win32_System_Shutdown", "Win32_System_ProcessStatus"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"

[target.'cfg(target_os = "linux")'.dependencies]
x11rb = "0.13"
mpris = "2"
flate2 = "1"
tar = "0.4"
